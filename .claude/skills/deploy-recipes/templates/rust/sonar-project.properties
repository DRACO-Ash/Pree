# sonar-project.properties :: SonarQube Code Quality gate scoping for a Rust App Store app.
# Shipped as a scaffold template by deploy-recipes. Commit it at the repository root so the
# platform's Code Quality stage scopes analysis correctly. The gate needs line coverage at
# least 80%, zero open violations, and every security hotspot resolved or reviewed.

sonar.projectKey=CHANGE_ME_project_key
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Coverage: SonarQube Community has no first-class Rust coverage importer, so lcov is the
# portable target the gate reads. Emit it with
# `cargo llvm-cov --lcov --output-path coverage/lcov.info` (needs the llvm-tools-preview
# component); without that component the file is silently empty. If your gate consumes the
# generic lcov path, point it here; otherwise convert to the format your gate profile expects.
# sonar.javascript.lcov.reportPaths=coverage/lcov.info

# COVERAGE exclusions ONLY (never analysis exclusions). Example, uncomment and justify per file:
# sonar.coverage.exclusions=src/main.rs
