# application.properties :: make Spring Boot honour the App Store runtime contract.
# Shipped as a scaffold template by deploy-recipes. Merge into src/main/resources.

# Read the platform-injected PORT (default 8080) rather than hardcoding it.
server.port=${PORT:8080}
# Bind all interfaces; the platform reaches the pod on 0.0.0.0, not loopback.
server.address=0.0.0.0
# Expose the health probe endpoints.
management.endpoint.health.probes.enabled=true

# In Spring Security, permitAll() on "/" and "/actuator/health" so the unauthenticated
# health contract returns 200, not 401. Example (in your SecurityFilterChain bean):
#   http.authorizeHttpRequests(a -> a
#       .requestMatchers("/", "/actuator/health").permitAll()
#       .anyRequest().authenticated());
