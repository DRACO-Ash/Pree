# sonar-project.properties :: SonarQube Code Quality gate scoping for a .NET App Store app.
# Shipped as a scaffold template by deploy-recipes. Note: the C# analyser is usually driven by
# the `dotnet-sonarscanner` MSBuild wrapper (begin/build/end) rather than a bare CLI scan; the
# coverage key below is the one that matters either way. Commit at the repository root. The
# gate needs line coverage at least 80%, zero open violations, and every hotspot reviewed.

sonar.projectKey=CHANGE_ME_project_key
sonar.sources=.
# Exclude the test project(s) from analysed sources.
sonar.tests=.
sonar.test.inclusions=**/*Tests/**,**/*Test/**
# Coverage MUST be OpenCover: Sonar's C# analyser does NOT consume the default Coverlet
# Cobertura output. Emit it with
# `dotnet test --collect:"XPlat Code Coverage" -p:CoverletOutputFormat=opencover`.
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.sourceEncoding=UTF-8

# COVERAGE exclusions ONLY (never analysis exclusions). Example, uncomment and justify per file:
# sonar.coverage.exclusions=**/Program.cs
