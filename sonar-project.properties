# sonar-project.properties :: SonarQube Code Quality gate scoping for Pree.
# The gate needs line coverage at least 80%, zero open violations, and every security
# hotspot resolved or reviewed.
#
# Sources live under src/ deliberately. The getting-started skill records that the platform
# forces sonar.sources=src, while appstore-gate-compliance records that a committed
# properties file is respected. Placing the source under src/ and declaring it here is
# correct under either reading, so no upload cycle is spent discovering which one holds.

sonar.projectKey=pree
sonar.projectName=Pree
sonar.sources=src
sonar.tests=tests
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
